<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Script Key</title>

<style>
body{
background:linear-gradient(120deg,#203a43,#2c5364);
font-family:sans-serif;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.box{
background:#0c1a20;
padding:40px;
border-radius:12px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.key{
background:#111;
padding:12px;
border-radius:6px;
margin-top:15px;
font-size:18px;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:6px;
background:#6c6cff;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Your Script Key</h2>

<div class="key" id="key">Loading...</div>

<button onclick="copyKey()">Copy Key</button>

</div>

<script>

function generateKey(){

const chars="abcdefghijklmnopqrstuvwxyz0123456789"

let date=new Date()

let seed=date.getUTCDate()+(date.getUTCMonth()+1)*50+date.getUTCFullYear()*1000

function rand(seed){
let x=Math.sin(seed)*10000
return x-Math.floor(x)
}

let key=""

for(let i=0;i<12;i++){
let r=Math.floor(rand(seed+i)*chars.length)
key+=chars[r]
}

return key

}

let key=generateKey()

document.getElementById("key").innerText=key

function copyKey(){

navigator.clipboard.writeText(key)

alert("Key copied")

}

</script>

</body>
</html>
