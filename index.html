<!DOCTYPE html>
<html>
<head>
<title>Shiba Key</title>
<style>
body{
background:#0f0f14;
color:white;
font-family:Arial;
text-align:center;
margin-top:100px;
}

.box{
background:#1c1c24;
padding:40px;
border-radius:10px;
display:inline-block;
}

.key{
font-size:28px;
color:#7a8cff;
margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
<h2>Today's Key</h2>
<div class="key" id="key"></div>
</div>

<script>

function generateKey(){

let secret = "x7k2p9s1"

let d = new Date()

let day = d.getDate()
let month = d.getMonth()+1
let year = d.getFullYear()

let raw = secret+day+month+year

let hash = 0

for(let i=0;i<raw.length;i++){
hash = (hash*31 + raw.charCodeAt(i)) % 100000000
}

return hash.toString()

}

document.getElementById("key").innerText = generateKey()

</script>

</body>
</html>
