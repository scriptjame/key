<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Key</title>

<style>

body{
background:linear-gradient(135deg,#0f1324,#1b1f3a);
font-family:Arial,Helvetica,sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
color:white;
}

.box{
background:#161a2e;
padding:40px;
border-radius:12px;
width:320px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h1{
margin-top:0;
font-size:26px;
}

.key{
background:#0f1324;
padding:12px;
border-radius:8px;
font-size:20px;
letter-spacing:2px;
margin-top:15px;
margin-bottom:20px;
}

button{
background:#5a6cff;
border:none;
color:white;
padding:10px 25px;
font-size:15px;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#6d7cff;
}

</style>
</head>

<body>

<div class="box">

<h1>Key</h1>

<div class="key" id="key"></div>

<button onclick="copyKey()">Copy</button>

</div>

<script>

function generateKey(){

let charset="abcdefghijklmnopqrstuvwxyz0123456789"

let d=new Date()

let seed=d.getDate()+(d.getMonth()+1)*50+d.getFullYear()*1000

let random=seed

let key=""

for(let i=0;i<12;i++){

random=(random*9301+49297)%233280

let index=Math.floor((random/233280)*charset.length)

key+=charset[index]

}

return key

}

let todayKey=generateKey()

document.getElementById("key").innerText=todayKey

function copyKey(){

navigator.clipboard.writeText(todayKey)

alert("Key copied!")

}

</script>

</body>
</html>
