<!DOCTYPE html>

<html>

<head>
<title>Script Key</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.box{
background:rgba(0,0,0,0.6);
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
width:350px;
}

h1{
margin-bottom:25px;
}

.keybox{
background:#111;
border:2px solid #444;
padding:12px;
border-radius:10px;
font-size:18px;
width:100%;
text-align:center;
color:white;
margin-bottom:20px;
}

button{
background:#6a5cff;
border:none;
padding:12px 25px;
border-radius:10px;
font-size:16px;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#8b7bff;
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="box">

<h1>Your Script Key</h1>

<input class="keybox" id="keybox" readonly>

<br>

<button onclick="copyKey()">Copy Key</button>

</div>

<script>

function generateDailyKey(){

let today = new Date().toDateString()

let seed = 0

for(let i=0;i<today.length;i++){
seed += today.charCodeAt(i)
}

let chars = "abcdefghijklmnopqrstuvwxyz0123456789"
let key = ""

for(let i=0;i<12;i++){
seed = (seed * 9301 + 49297) % 233280
let index = seed % chars.length
key += chars[index]
}

return key

}

let dailyKey = generateDailyKey()

document.getElementById("keybox").value = dailyKey

function copyKey(){

let key=document.getElementById("keybox")

key.select()

document.execCommand("copy")

alert("Key copied!")

}

</script>

</body>

</html>
